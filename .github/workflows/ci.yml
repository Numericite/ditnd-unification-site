name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  NODE_VERSION: "24"

jobs:
  build:
    name: Lint, typecheck & build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Biome check
        run: yarn run check

      - name: TypeScript check
        run: yarn typecheck

      - name: Payload generate types
        run: npx payload generate:types
        env:
          PAYLOAD_SECRET: ci-build-secret
          POSTGRESQL_ADDON_URI: postgres://user:password@localhost:5432/ci-build

      - name: Next.js build
        run: yarn build
        env:
          PAYLOAD_SECRET: ci-build-secret
          POSTGRESQL_ADDON_URI: postgres://user:password@localhost:5432/ci-build
          NEXT_PUBLIC_NOINDEX: "true"

  e2e:
    name: Cypress E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: maisondelautisme-site
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d maisondelautisme-site"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
      maildev:
        image: maildev/maildev:2.1.0
        ports:
          - 1025:1025
          - 1080:1080
        # The image's baked-in HEALTHCHECK reports "unhealthy" reliably
        # (also reproducible locally). The container itself is up in <1s
        # per its own logs, so override with a no-op check.
        options: --health-cmd="exit 0" --health-interval=1s --health-retries=1
    env:
      PAYLOAD_SECRET: ci-e2e-secret-please-rotate
      POSTGRESQL_ADDON_URI: postgres://user:password@localhost:5432/maisondelautisme-site
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_FROM_ADDRESS: ci@maisondelautisme.test
      SMTP_FROM_NAME: CI
      CONTACT_PROS_CRA_RECIPIENT: contact@maisondelautisme.test
      CONTACT_PARTICULIERS_RECIPIENT: contact@maisondelautisme.test
      NEXT_PUBLIC_NOINDEX: "true"
      # Albert is served by cypress/mocks/albert.mjs: publishing a practical
      # guide (embeddings, simplification) stays deterministic and offline.
      ALBERT_API_URL: http://127.0.0.1:4010
      ALBERT_API_KEY: e2e-mock
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore dependencies
        id: dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/Cypress
          key: e2e-dependencies-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('yarn.lock', 'patches/**') }}

      - name: Install dependencies
        if: steps.dependencies.outputs.cache-hit != 'true'
        run: |
          yarn install --frozen-lockfile
          npx cypress verify

      - name: Start Albert mock
        run: nohup node cypress/mocks/albert.mjs > albert-mock.log 2>&1 &

      - name: Seed database
        run: yarn seed:dev

      # Turbopack keeps its build cache in .next/cache: pull requests reuse
      # the one saved by the last build of main.
      - name: Restore Next.js build cache
        uses: actions/cache/restore@v4
        with:
          path: .next/cache
          key: e2e-next-${{ runner.os }}-${{ hashFiles('yarn.lock') }}-${{ github.sha }}
          restore-keys: e2e-next-${{ runner.os }}-${{ hashFiles('yarn.lock') }}-

      - name: Build app
        run: yarn build

      - name: Save Next.js build cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: .next/cache
          key: e2e-next-${{ runner.os }}-${{ hashFiles('yarn.lock') }}-${{ github.sha }}

      - name: Run Cypress
        uses: cypress-io/github-action@v6
        with:
          install: false
          start: yarn start
          wait-on: "http://localhost:3000"
          wait-on-timeout: 180
          # Needs the real Albert API, see the spec header.
          config: excludeSpecPattern=cypress/e2e/chatbot-llm.cy.ts

      - name: Upload Cypress screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
